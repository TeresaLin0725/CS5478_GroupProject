[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-search"
version = "0.1.0"
description = "Indoor object-search comparison scaffold (contract 1.0)"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7,<8.4"]

[project.scripts]
frontier-search = "frontier_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"frontier_search.runner" = ["indoor_viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
